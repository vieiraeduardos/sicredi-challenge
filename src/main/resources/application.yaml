spring:
  application:
    name: sicredi-challenge
  cloud:
    discovery:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 50
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

app:
  host: ${APP_HOST:http://localhost:8080}
  logging:
    slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:1000}
  sicredi-user-info:
    url: https://user-info.herokuapp.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always