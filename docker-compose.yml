services:
  postgres:
    image: postgres:16-alpine
    container_name: sicredi-postgres
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sicredi-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/db
      DB_USERNAME: admin
      DB_PASSWORD: admin
      APP_HOST: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
